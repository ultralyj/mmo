# Morphometric Imitation residual-RL configuration for Wuji Hand2 + apple.
# The paper specifies the form of the observation, reward, termination, and
# randomization, but does not publish the numeric values below. Every value is
# therefore a reproduction assumption until official supplementary code/configs
# become available.

reward:
  add_alpha: 50.0
  final_add_success_m: 0.05
  contact_force_threshold_n: 0.01

termination:
  ema_decay: 0.95
  add_ema_threshold_m: 0.08
  contact_mismatch_ema_threshold: 0.8
  maximum_contact_force_n: 50.0
  table_collision_force_n: 1.0

control:
  simulation_frequency_hz: 120
  control_frequency_hz: 30
  reference_stride: 4
  future_steps: 4
  residual_limit_rad: 0.25
  stiffness: 200.0
  damping: 10.0
  force_limit: 5.0

physics:
  object_mass_kg: 0.15
  object_friction: 0.8
  hand_friction: 1.0
  table_friction: 0.8

randomization:
  # The paper specifies a 10 cm x 10 cm initial-position region and +/-15 deg yaw.
  # Disabled until the deterministic hand-only pipeline is verified.
  enabled: false
  object_position_range_m: 0.05
  object_yaw_range_rad: 0.2617993878
  random_start: false
  # The paper does not publish the external-force magnitude. This small value is
  # a conservative reproduction assumption for the first debugging stage.
  external_force_range_n: 0.0

ppo:
  seed: 1
  num_envs: 128
  rollout_steps: 256
  total_timesteps: 5000000
  learning_rate: 0.0003
  gamma: 0.99
  gae_lambda: 0.95
  clip_coefficient: 0.2
  entropy_coefficient: 0.0
  value_coefficient: 0.5
  max_gradient_norm: 0.5
  update_epochs: 4
  minibatches: 8
  hidden_sizes: [256, 256]
